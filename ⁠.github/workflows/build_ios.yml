name: Build iOS App (.ipa)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Xcode Version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Build and Package IPA
      run: |
        echo "[*] កំពុងរៀបចំកូដ និង Compile លើ Cloud macOS..."
        
        # ជំហានស្ថាបនា Project និង Archive ចេញជា .ipa
        # (ដាក់คำสั่ง xcodebuild របស់អ្នកនៅទីនេះ)
        xcodebuild -project YourAppProject.xcodeproj \
                   -scheme YourAppScheme \
                   -sdk iphoneos \
                   -configuration Release \
                   archive -archivePath build/YourApp.xcarchive
                   
        xcodebuild -exportArchive \
                   -archivePath build/YourApp.xcarchive \
                   -exportPath build/output \
                   -exportOptionsPlist ExportOptions.plist

    - name: Upload Generated IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: CADENZZA-iOS-App
        path: build/output/*.ipa
