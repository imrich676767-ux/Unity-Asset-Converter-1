name: CADENZZA Auto Convert iOS Build

on:
  push:
    branches: [ main ]

jobs:
  build-cadenzza:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Asset Processing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install UnityPy Pillow

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Build CADENZZA Archive
        run: |
          echo "[*] កំពុងសាងសង់ CADENZZA Auto Convert App..."
          xcodebuild -project CADENZZA.xcodeproj \
                     -scheme CADENZZA \
                     -sdk iphoneos \
                     -configuration Release \
                     archive -archivePath build/CADENZZA.xcarchive

      - name: Export CADENZZA.ipa
        run: |
          xcodebuild -exportArchive \
                     -archivePath build/CADENZZA.xcarchive \
                     -exportPath build/output \
                     -exportOptionsPlist ExportOptions.plist

      - name: Upload CADENZZA IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: CADENZZA-ipa
          path: build/output/*.ipa
